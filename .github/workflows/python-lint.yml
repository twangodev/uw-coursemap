permissions:
  contents: read
name: Python Linting

on:
  push:
  pull_request:

jobs:
  ruff:
    name: Ruff Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: generation
            project: .
            source: generation
          - name: search
            project: search
            source: .
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      
      - name: Install Dependencies
        run: uv sync --locked --dev
      
      - name: Run Ruff Format Check
        run: uv run ruff format --check ${{ matrix.source }}
      
      - name: Run Ruff Linter
        run: uv run ruff check ${{ matrix.source }}

      - name: Run pipeline regression tests
        if: matrix.name == 'generation'
        run: uv run python -m unittest discover -s generation/tests -v
