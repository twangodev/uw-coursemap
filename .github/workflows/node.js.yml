name: Website CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: uv run --locked uwcourses-site import --limit 8
      - run: bun run check
      - run: bun run test
      - run: uv run --locked python -m unittest discover -s web/tests -p 'test_*.py'
      - run: bun x playwright install --with-deps chromium
      - name: Cache social cards
        uses: actions/cache@v5
        with:
          path: .site/social-cache
          key: ${{ runner.os }}-social-${{ hashFiles('web/social-images.mjs', 'web/social-card.html', 'static/fonts/OverusedGrotesk-VF.woff2', 'static/uw-coursemap-logo.svg') }}-${{ hashFiles('.site/status.json') }}
          restore-keys: |
            ${{ runner.os }}-social-${{ hashFiles('web/social-images.mjs', 'web/social-card.html', 'static/fonts/OverusedGrotesk-VF.woff2', 'static/uw-coursemap-logo.svg') }}-
      - name: Preserve sitemap modification history
        uses: actions/cache@v5
        with:
          path: .site/sitemap-history.json
          key: ${{ runner.os }}-sitemap-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-sitemap-${{ github.workflow }}-
      - run: bun run build
      - run: bun run seo:check
      - run: uv run --locked uwcourses-site assets-check
      - run: bun x playwright test
