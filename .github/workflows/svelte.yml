name: Svelte
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      first_deployment:
        description: First deployment (Worker does not exist yet)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'website-production' || format('svelte-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  data:
    name: Import dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run --locked uwcourses-site import
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - run: uv run --locked uwcourses-site release-check
      - run: uv run --locked python -m unittest discover -s web/tests -p 'test_*.py'
      # One pinned dataset is shared by every check and the deployment.
      - run: tar -czf website-data.tar.gz .site
      - uses: actions/upload-artifact@v4
        with:
          name: website-data
          path: website-data.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - run: tar -czf website-static.tar.gz static/data
      - uses: actions/upload-artifact@v4
        with:
          name: website-static
          path: website-static.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  tests:
    name: Types and unit tests
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: website-data
      - run: tar -xzf website-data.tar.gz
      - run: rm website-data.tar.gz
      - run: bun run check
      - run: bun run test
  build:
    name: Build and audit
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: website-data
      - run: tar -xzf website-data.tar.gz
      - run: rm website-data.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: website-static
      - run: tar -xzf website-static.tar.gz
      - run: rm website-static.tar.gz
      - run: bun x playwright install --with-deps chromium
      - name: Restore social cards
        id: social-cache
        uses: actions/cache/restore@v5
        with:
          path: .site/social-cache
          key: ${{ runner.os }}-social-${{ hashFiles('web/social-images.mjs', 'web/social-card.html', 'static/fonts/OverusedGrotesk-VF.woff2', 'static/uwcourses-logo.svg') }}-${{ hashFiles('.site/status.json') }}
          restore-keys: |
            ${{ runner.os }}-social-${{ hashFiles('web/social-images.mjs', 'web/social-card.html', 'static/fonts/OverusedGrotesk-VF.woff2', 'static/uwcourses-logo.svg') }}-
      - run: bun run build
      - name: Save social cards
        if: steps.social-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .site/social-cache
          key: ${{ steps.social-cache.outputs.cache-primary-key }}
      - run: bun run seo:check
      - run: uv run --locked uwcourses-site assets-check
      # Tar preserves hidden Worker files and avoids uploading 70,000 entries individually.
      - run: tar -czf website-build.tar.gz .svelte-kit/cloudflare .svelte-kit/cloudflare-tmp .svelte-kit/output/server
      - uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: website-build.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  browser-data:
    name: Prepare browser database
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: website-data
      - run: tar -xzf website-data.tar.gz
      - run: rm website-data.tar.gz
      - run: bun run test:browser:setup
      - run: tar -czf website-browser-data.tar.gz .site/browser-state
      - uses: actions/upload-artifact@v4
        with:
          name: website-browser-data
          path: website-browser-data.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  browser:
    name: Browser tests
    needs: [build, browser-data]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: website-data
      - run: tar -xzf website-data.tar.gz
      - run: rm website-data.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: website-build
      - run: tar -xzf website-build.tar.gz
      - run: rm website-build.tar.gz
      - run: bun x playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: website-browser-data
      - run: tar -xzf website-browser-data.tar.gz
      - run: rm website-browser-data.tar.gz
      - run: bun x playwright test
        env:
          BROWSER_DB_PREPARED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
  check:
    name: Svelte
    if: always()
    needs: [data, tests, build, browser-data, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          PASSED: ${{ needs.data.result == 'success' && needs.tests.result == 'success' && needs.build.result == 'success' && needs.browser-data.result == 'success' && needs.browser.result == 'success' }}
        run: test "$PASSED" = true
  deploy:
    name: Deploy
    needs: check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://uwcourses.com
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: website-data
      - run: tar -xzf website-data.tar.gz
      - run: rm website-data.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: website-build
      - run: tar -xzf website-build.tar.gz
      - run: rm website-build.tar.gz
      - name: Deploy verified release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIRST_DEPLOYMENT: ${{ inputs.first_deployment || false }}
        run: uv run --locked uwcourses-site deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-release
          path: |
            .site/status.json
            .site/d1-check.json
          include-hidden-files: true
          retention-days: 30
