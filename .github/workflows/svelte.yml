name: Svelte
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      provision_database:
        description: Create the uwcourses search database (one-time migration)
        type: boolean
        default: false
      first_deployment:
        description: First deployment (Worker does not exist yet)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    name: Svelte
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    concurrency:
      group: svelte-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: uv run --locked uwcourses-site import
      - run: uv run --locked python -m unittest discover -s web/tests -p 'test_*.py'
      - run: bun run check
      - run: bun run test
      - run: bun x playwright install --with-deps chromium
      - name: Cache social cards
        uses: actions/cache@v5
        with:
          path: .site/social-cache
          key: ${{ runner.os }}-social-${{ hashFiles('web/social-images.mjs', 'web/social-card.html', 'static/fonts/OverusedGrotesk-VF.woff2', 'static/uwcourses-logo.svg') }}-${{ hashFiles('.site/status.json') }}
          restore-keys: |
            ${{ runner.os }}-social-${{ hashFiles('web/social-images.mjs', 'web/social-card.html', 'static/fonts/OverusedGrotesk-VF.woff2', 'static/uwcourses-logo.svg') }}-
      - run: bun run build
      - run: bun run seo:check
      - run: uv run --locked uwcourses-site assets-check
      - run: bun x playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ github.job }}
          path: test-results/
          retention-days: 7
  deploy:
    name: Deploy
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.provision_database)
    concurrency:
      group: website-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://uwcourses.com
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: uv run --locked uwcourses-site import
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - run: uv run --locked uwcourses-site release-check
      - run: bun run check
      - run: bun run test
      - run: uv run --locked python -m unittest discover -s web/tests -p 'test_*.py'
      - run: bun x playwright install --with-deps chromium
      - name: Cache social cards
        uses: actions/cache@v5
        with:
          path: .site/social-cache
          key: ${{ runner.os }}-social-${{ hashFiles('web/social-images.mjs', 'web/social-card.html', 'static/fonts/OverusedGrotesk-VF.woff2', 'static/uwcourses-logo.svg') }}-${{ hashFiles('.site/status.json') }}
          restore-keys: |
            ${{ runner.os }}-social-${{ hashFiles('web/social-images.mjs', 'web/social-card.html', 'static/fonts/OverusedGrotesk-VF.woff2', 'static/uwcourses-logo.svg') }}-
      - run: bun run build
      - run: bun run seo:check
      - run: bun x playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ github.job }}
          path: test-results/
          retention-days: 7
      - name: Deploy verified release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIRST_DEPLOYMENT: ${{ inputs.first_deployment || false }}
        run: uv run --locked uwcourses-site deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-release
          path: |
            .site/status.json
            .site/d1-check.json
          retention-days: 30
  provision:
    name: Create uwcourses search database
    if: github.event_name == 'workflow_dispatch' && inputs.provision_database
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun x wrangler d1 create uwcourses --location enam --no-update-config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
