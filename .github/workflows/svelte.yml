name: Svelte
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: svelte-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Svelte
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: uv run --locked uwcourses-site import --limit 8
      - run: bun run check
      - run: bun run test
      - run: bun x playwright install --with-deps chromium
      - name: Cache social cards
        uses: actions/cache@v5
        with:
          path: .site/social-cache
          key: ${{ runner.os }}-social-${{ hashFiles('web/social-images.mjs', 'web/social-card.html', 'static/fonts/OverusedGrotesk-VF.woff2', 'static/uw-coursemap-logo.svg') }}-${{ hashFiles('.site/status.json') }}
          restore-keys: |
            ${{ runner.os }}-social-${{ hashFiles('web/social-images.mjs', 'web/social-card.html', 'static/fonts/OverusedGrotesk-VF.woff2', 'static/uw-coursemap-logo.svg') }}-
      - run: bun run build
      - run: bun run seo:check
      - run: uv run --locked uwcourses-site assets-check
      - run: bun x playwright test
